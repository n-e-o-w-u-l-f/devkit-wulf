name: Go stable system-native contract

on:
  pull_request:
    paths:
      - 'environments/go/stable.json'
      - 'environments/schema/verified-artifact-environment.schema.json'
      - 'manifests/go-artifact.json'
      - 'manifests/go-windows.json'
      - 'manifests/schema/go-windows.schema.json'
      - 'lib/go-artifact.sh'
      - 'lib/go-windows.ps1'
      - 'installers/linux/devkit-wulf.sh'
      - 'installers/wsl/devkit-wulf.sh'
      - 'installers/macos/devkit-wulf.sh'
      - 'installers/windows/devkit-wulf.ps1'
      - 'installers/linux/environments/go-stable.sh'
      - 'installers/wsl/environments/go-stable.sh'
      - 'installers/macos/environments/go-stable.sh'
      - 'installers/windows/environments/go-stable.ps1'
      - 'tests/validate_go_stable_system_native.py'
      - 'tests/validate_python_312_routing.py'
      - 'tests/test_go_windows.ps1'
      - 'docs/environments/go-stable.md'
      - '.github/workflows/go-stable-system-native.yml'
  push:
    branches: [main]
    paths:
      - 'environments/go/stable.json'
      - 'environments/schema/verified-artifact-environment.schema.json'
      - 'manifests/go-artifact.json'
      - 'manifests/go-windows.json'
      - 'manifests/schema/go-windows.schema.json'
      - 'lib/go-artifact.sh'
      - 'lib/go-windows.ps1'
      - 'installers/**/devkit-wulf.*'
      - 'installers/**/environments/go-stable.*'
      - 'tests/validate_go_stable_system_native.py'
      - 'tests/validate_python_312_routing.py'
      - 'tests/test_go_windows.ps1'
      - 'docs/environments/go-stable.md'
      - '.github/workflows/go-stable-system-native.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Go stable system-native contract
        run: |
          python3 tests/validate_go_stable_system_native.py
          python3 tests/validate_python_312_routing.py

      - name: Parse POSIX routes and adapters
        shell: sh
        run: |
          set -eu
          sh -n installers/linux/devkit-wulf.sh
          sh -n installers/wsl/devkit-wulf.sh
          sh -n installers/macos/devkit-wulf.sh
          sh -n installers/linux/environments/go-stable.sh
          sh -n installers/wsl/environments/go-stable.sh
          sh -n installers/macos/environments/go-stable.sh

      - name: ShellCheck POSIX routes and adapters
        run: >-
          shellcheck
          installers/linux/devkit-wulf.sh
          installers/wsl/devkit-wulf.sh
          installers/macos/devkit-wulf.sh
          installers/linux/environments/go-stable.sh
          installers/wsl/environments/go-stable.sh
          installers/macos/environments/go-stable.sh

      - name: Experimental gate precedes Go artifact dependencies and network
        shell: sh
        run: |
          set -eu
          if ./installers/linux/devkit-wulf.sh install go@stable >gate.out 2>&1; then
            echo 'go@stable unexpectedly installed without --experimental' >&2
            exit 1
          fi
          grep -F 'install requires --experimental' gate.out

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate shared Go stable contract on Windows
        shell: pwsh
        run: |
          python tests/validate_go_stable_system_native.py

      - name: Parse Windows route, adapter and helper
        shell: pwsh
        run: |
          $files = @(
            'installers/windows/devkit-wulf.ps1',
            'installers/windows/environments/go-stable.ps1',
            'lib/go-windows.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file: $($_.Message)" }
              exit 1
            }
          }

      - name: Prove Windows experimental gate fails before mutation
        shell: pwsh
        run: |
          $stateDir = Join-Path $env:RUNNER_TEMP ('devkit-wulf-go-gate-' + [guid]::NewGuid().ToString('N'))
          $oldState = $env:DEVKIT_WULF_STATE_DIR
          try {
            $env:DEVKIT_WULF_STATE_DIR = $stateDir
            try {
              & .\installers\windows\devkit-wulf.ps1 install 'go@stable'
              throw 'go@stable unexpectedly installed without -Experimental'
            } catch {
              if ($_.Exception.Message -notmatch 'install requires -Experimental') {
                throw
              }
            }
            if (Test-Path -LiteralPath $stateDir) {
              throw 'experimental gate mutated state before explicit opt-in'
            }
          } finally {
            if ($null -eq $oldState) {
              Remove-Item Env:DEVKIT_WULF_STATE_DIR -ErrorAction SilentlyContinue
            } else {
              $env:DEVKIT_WULF_STATE_DIR = $oldState
            }
            if (Test-Path -LiteralPath $stateDir) {
              Remove-Item -LiteralPath $stateDir -Recurse -Force
            }
          }

      - name: Run Windows offline artifact fixture
        shell: pwsh
        run: .\tests\test_go_windows.ps1
