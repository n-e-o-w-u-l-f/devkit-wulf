name: php-windows-environment

on:
  pull_request:
    paths:
      - 'bin/devkit-wulf.ps1'
      - 'lib/php-windows-environment.ps1'
      - 'tests/test_php_windows_environment.ps1'
      - 'tests/test_powershell.ps1'
      - 'docs/environments/php-windows-environment.md'
      - '.github/workflows/php-windows-environment.yml'
      - 'lib/php-windows.ps1'
      - 'lib/composer-windows.ps1'
      - 'manifests/php-windows.json'
      - 'manifests/composer-windows.json'
  push:
    branches: [main]
    paths:
      - 'bin/devkit-wulf.ps1'
      - 'lib/php-windows-environment.ps1'
      - 'tests/test_php_windows_environment.ps1'
      - 'tests/test_powershell.ps1'
      - 'lib/php-windows.ps1'
      - 'lib/composer-windows.ps1'
      - 'manifests/php-windows.json'
      - 'manifests/composer-windows.json'

permissions:
  contents: read

jobs:
  orchestration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Analyze PHP orchestration and central CLI
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path bin/devkit-wulf.ps1,lib/php-windows-environment.ps1,lib/php-windows.ps1,lib/composer-windows.ps1,tests/test_php_windows_environment.ps1,tests/test_powershell.ps1 -Severity Error,Warning
          $results | Format-Table -AutoSize
          $blocking = @($results | Where-Object Severity -eq 'Error')
          if ($blocking.Count -gt 0) { throw 'Blocking PSScriptAnalyzer errors detected' }
      - name: Run central PowerShell CLI smoke tests
        shell: pwsh
        run: .\tests\test_powershell.ps1
      - name: Run orchestration fixture
        shell: pwsh
        run: .\tests\test_php_windows_environment.ps1
      - name: Run component fixtures
        shell: pwsh
        run: |
          .\tests\test_php_windows.ps1
          .\tests\test_composer_windows.ps1
