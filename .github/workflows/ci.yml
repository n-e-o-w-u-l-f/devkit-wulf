name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  manifest-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate semantic manifest contract
        run: python tests/validate_manifests.py
      - name: Validate JSON Schema
        run: |
          python -m pip install --disable-pip-version-check jsonschema
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          root = Path('.')
          schema = json.loads((root/'manifests/schema/environment-catalog.schema.json').read_text())
          catalog = json.loads((root/'manifests/environments.json').read_text())
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(catalog)
          print('JSON Schema validation passed')
          PY

  posix-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: ShellCheck
        run: shellcheck bin/devkit-wulf bootstrap/*.sh scripts/*.sh tests/*.sh
      - name: Security scan
        run: sh scripts/security-scan.sh
      - name: CLI smoke test
        run: sh tests/test_cli.sh

  posix-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: brew install jq shellcheck
      - name: ShellCheck
        run: shellcheck bin/devkit-wulf bootstrap/*.sh scripts/*.sh tests/*.sh
      - name: CLI smoke test
        run: sh tests/test_cli.sh

  powershell-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Analyze PowerShell
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path bin,bootstrap,tests -Recurse -Severity Error,Warning
          $results | Format-Table -AutoSize
          if ($results) { throw 'PSScriptAnalyzer findings detected' }
      - name: PowerShell CLI smoke test
        shell: pwsh
        run: .\tests\test_powershell.ps1

  distro-detection:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: archlinux:latest
            setup: pacman -Syu --noconfirm jq
          - image: fedora:latest
            setup: dnf install -y jq
          - image: alpine:latest
            setup: apk add --no-cache jq bash
    steps:
      - uses: actions/checkout@v4
      - name: Detect and plan inside distribution container
        env:
          IMAGE: ${{ matrix.image }}
          SETUP: ${{ matrix.setup }}
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -e DEVKIT_WULF_STATE_DIR=/tmp/devkit-wulf-state \
            "$IMAGE" sh -ec "$SETUP; sh /repo/bin/devkit-wulf detect; sh /repo/bin/devkit-wulf plan base | grep mutates_host=false"
